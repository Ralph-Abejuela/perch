name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PERCH_REDIS_URL: redis://127.0.0.1:6379/15
          PERCH_RATE_LIMIT_PER_MINUTE: "300"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            widget/pnpm-lock.yaml
      - run: pnpm install --prefix widget --frozen-lockfile
      - run: pnpm run --prefix widget build
      - run: pnpm install --prefix frontend --frozen-lockfile
      - run: pnpm run --prefix frontend build
      - name: Docker build (smoke)
        run: docker build -f backend/Dockerfile .
