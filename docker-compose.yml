services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Override with PERCH_IMAGE=<dockerhub-user>/perch:latest if you publish your own build.
    image: ${PERCH_IMAGE:-ralphabejuela/perch:latest}
    environment:
      PERCH_DATABASE_URL: postgresql+psycopg://perch:perch@db:5432/perch
      PERCH_REDIS_URL: redis://redis:6379/0
      # Change this to a long random string in production!
      PERCH_JWT_SECRET: ${PERCH_JWT_SECRET:-dev-secret-change-me}
      # When the dashboard is on a different domain (e.g. Cloudflare Pages),
      # set PERCH_CORS_ORIGINS to that origin and PERCH_COOKIE_SAMESITE=none.
      PERCH_CORS_ORIGINS: ${PERCH_CORS_ORIGINS:-http://localhost:5173}
      PERCH_COOKIE_SAMESITE: ${PERCH_COOKIE_SAMESITE:-lax}
      PERCH_COOKIE_SECURE: ${PERCH_COOKIE_SECURE:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: perch
      POSTGRES_PASSWORD: perch
      POSTGRES_DB: perch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" # exposed for local dev/tests; remove in production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: expose the backend through a Cloudflare Tunnel instead of open ports.
  # Set CLOUDFLARE_TUNNEL_TOKEN in your environment or .env file.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - app

volumes:
  pgdata:
