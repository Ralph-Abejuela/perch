# Enable a Cloudflare Tunnel for the backend without opening inbound ports:
#   docker compose -f docker-compose.yml -f compose.cloudflared.yml up -d
# Requires CLOUDFLARE_TUNNEL_TOKEN (from `cloudflared tunnel create` / Zero Trust dashboard).
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped
